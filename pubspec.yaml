name: croppy
description: A fully customizable image cropper for Flutter. Mobile-first, but supports Web and Desktop platforms.
version: 1.5.4
homepage: https://github.com/kekland/croppy

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  cassowary: ^0.4.3

  # ffi/native assets
  ffi: ^2.2.0
  code_assets: ^2.1.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.5
  android_libcpp_shared: ^0.3.1
  logging: ^1.3.0

  cupertino_icons: ^2.0.0
  equatable: ^3.0.0
  vector_math: ^2.4.3
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^22.0.0

flutter:
  plugin:
    platforms:
      web:
